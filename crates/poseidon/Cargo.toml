[package]
name = "dusk-poseidon"
version = "0.42.0-rc.0"
description = "Implementation of Poseidon hash algorithm over the Bls12-381 Scalar field."
categories = ["algorithms", "cryptography", "no-std", "wasm"]
keywords = ["cryptography", "zero-knowledge", "crypto"]

repository = "https://github.com/dusk-network/zk-tools"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"

[dependencies]
dusk-curves = { version = "=0.2.1", default-features = false, features = ["zeroize"] }
dusk-jubjub = { version = "0.15", default-features = false }
dusk-zk-composer = { version = "0.1.0", path = "../composer", default-features = false, features = ["alloc", "zeroize"], optional = true }
dusk-safe = "0.3"

[dev-dependencies]
criterion = "0.5"
rand = { version = "0.8", default-features = false, features = ["getrandom", "std_rng"] }
ff = { version = "0.13", default-features = false }
once_cell = "1"
dusk-bytes = "0.1"
dusk-plonk = { version = "0.22.1", path = "../plonk", default-features = false, features = ["alloc", "zeroize"] }

[features]
default = []
bls-backend-dusk = [
    "dusk-curves/bls-backend-dusk",
    "dusk-zk-composer?/bls-backend-dusk",
]
bls-backend-blst = [
    "dusk-curves/bls-backend-blst",
    "dusk-zk-composer?/bls-backend-blst",
]
zk = [
    "dep:dusk-zk-composer",
]
encryption = ["dusk-safe/encryption"]

[package.metadata.docs.rs]
no-default-features = true
features = ["bls-backend-blst", "zk", "encryption"]

[[bench]]
name = "hash"
harness = false
required-features = ["zk"]

[[bench]]
name = "encrypt"
harness = false
required-features = ["zk", "encryption"]

[[bench]]
name = "decrypt"
harness = false
required-features = ["zk", "encryption"]
