[package]
name = "poseidon-merkle"
description = "Crate implementing Dusk Network's Merkle tree with the poseidon hash function"
version = "0.9.0-rc.0"

categories = ["data-structures", "no-std"]
keywords = ["tree", "merkle", "poseidon", "data", "structure"]
repository = "https://github.com/dusk-network/zk-tools"
authors = [
    "Eduardo Leegwater Simões <eduardo@dusk.network>",
    "Moana Marcello <moana@dusk.network>",
]

edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"

[dependencies]
dusk-bytes = "0.1"
dusk-merkle = { version = "0.6.0-rc.0", path = "../dusk-merkle", default-features = false }
dusk-poseidon = { version = "0.42.0-rc.0", path = "../../poseidon", default-features = false }
dusk-curves = { version = "=0.2.1", default-features = false }
dusk-zk-composer = { version = "0.1.0", path = "../../composer", optional = true, default-features = false }
rkyv = { version = "0.7", optional = true, default-features = false }
bytecheck = { version = "0.6", optional = true, default-features = false }

[dev-dependencies]
rand = "0.8"
criterion = "0.3"
ff = { version = "0.13", default-features = false }
dusk-plonk = { version = "0.22.1", path = "../../plonk", default-features = false, features = ["alloc"] }

[features]
default = []
bls-backend-dusk = [
    "dusk-curves/bls-backend-dusk",
    "dusk-poseidon/bls-backend-dusk",
    "dusk-zk-composer?/bls-backend-dusk",
]
bls-backend-blst = [
    "dusk-curves/bls-backend-blst",
    "dusk-poseidon/bls-backend-blst",
    "dusk-zk-composer?/bls-backend-blst",
]
zk = ["dusk-zk-composer/alloc", "dusk-poseidon/zk"]
size_16 = ["rkyv/size_16"]
size_32 = ["rkyv/size_32"]
size_64 = ["rkyv/size_64"]
rkyv-impl = [
    "rkyv/validation",
    "rkyv/alloc",
    "rkyv",
    "bytecheck",
    "dusk-curves/rkyv-impl",
    "dusk-merkle/rkyv-impl",
]

[[bench]]
name = "poseidon"
harness = false

[[bench]]
name = "zk"
harness = false
required-features = ["zk"]

[[test]]
name = "zk"
required-features = ["zk"]

[[example]]
name = "zk"
required-features = ["zk"]

[package.metadata.docs.rs]
no-default-features = true
features = ["bls-backend-blst", "zk", "rkyv-impl", "size_32"]
