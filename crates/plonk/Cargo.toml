[package]
name = "dusk-plonk"
version = "0.22.1"
categories =["algorithms", "cryptography", "science", "mathematics"]
edition = "2024"
rust-version = "1.85"
keywords = ["cryptography", "plonk", "zk-snarks", "zero-knowledge", "crypto"]
license = "MPL-2.0"
repository = "https://github.com/dusk-network/zk-tools"
description = "A pure-Rust implementation of the PLONK ZK-Proof algorithm"
exclude = [
    "**/.gitignore",
    ".gitignore",
    "Cargo.lock",
    ".github/"
]

[dependencies]
blake2b_simd = { version = "=1.0.3", default-features = false }
merlin = {version = "3.0", default-features = false}
rand_core = {version="0.6", default-features=false}
dusk-bytes = "0.1"
dusk-curves = { version = "=0.2.1", default-features = false }
dusk-jubjub = {version = "0.15", default-features = false}
ff = {version = "0.13", default-features = false}
itertools = {version = "0.9", default-features = false}
hashbrown = {version = "0.9", default-features=false, features = ["ahash"]}
rayon = {version = "1.3", optional = true}
cfg-if = "1.0"
dusk-zk-composer = { version = "0.1.0", path = "../composer", default-features = false, optional = true, features = ["plonkish"] }
# Dusk related deps for WASMI serde
rkyv = {version = "0.7", optional = true, default-features = false}
bytecheck = {version = "0.6", optional = true, default-features = false}

[dev-dependencies]
criterion = "0.5"
dusk-cdf = "0.5"
tempdir = "0.3"
rand = "0.8"
rkyv = {version = "0.7", default-features = false, features = ["size_32"]}
dusk-zk-composer = { version = "0.1.0", path = "../composer", default-features = false, features = ["plonkish", "test-api"] }

[features]
default = ["std"]
bls-backend-dusk = ["dusk-curves/bls-backend-dusk", "dusk-zk-composer?/bls-backend-dusk"]
bls-backend-blst = ["dusk-curves/bls-backend-blst", "dusk-zk-composer?/bls-backend-blst"]
legacy-proving = []
std = [
    "rand_core/std",
    "dusk-jubjub/default",
    "itertools/default",
    "hashbrown/default",
    "alloc",
    "rayon",
    "dusk-zk-composer/std"
]
alloc = ["dep:dusk-zk-composer", "dusk-zk-composer/plonkish"]
parallel = ["dusk-curves/parallel", "dusk-zk-composer?/parallel"]
debug = ["dusk-zk-composer/debug"]
rkyv-impl = ["dusk-curves/rkyv-impl", "dusk-jubjub/rkyv-impl", "rkyv", "bytecheck", "dusk-zk-composer?/rkyv-impl"]
zeroize = ["dusk-zk-composer?/zeroize"]

[[example]]
name = "circuit"
required-features = ["alloc"]

[[bench]]
name = "plonk"
harness = false

[[test]]
name = "append_gate"
required-features = ["alloc"]

[[test]]
name = "assert_point"
required-features = ["alloc"]

[[test]]
name = "assert_scalar"
required-features = ["alloc"]

[[test]]
name = "boolean"
required-features = ["alloc"]

[[test]]
name = "composer"
required-features = ["alloc"]

[[test]]
name = "debugger"
required-features = ["debug", "std"]

[[test]]
name = "decomposition"
required-features = ["alloc"]

[[test]]
name = "ecc"
required-features = ["alloc"]

[[test]]
name = "error_size"
required-features = ["alloc"]

[[test]]
name = "gate_add_mul"
required-features = ["alloc"]

[[test]]
name = "logic"
required-features = ["alloc"]

[[test]]
name = "range"
required-features = ["alloc"]

[[test]]
name = "select_bls"
required-features = ["alloc"]

[[test]]
name = "select_point"
required-features = ["alloc"]

[[test]]
name = "truncate"
required-features = ["alloc"]

[package.metadata.docs.rs]
no-default-features = true
features = ["bls-backend-blst", "std"]
rustdoc-args = [ "--html-in-header", "./katex-header.html" ]
