name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: make fmt CHECK=1
      - name: Validate website
        run: make website-check

  validation:
    name: Workspace validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The workspace includes plonkwasm. Backend selection is explicit, and
      # the Merkle crates expose mutually exclusive size_* features, so
      # --all-features is not a valid feature set.
      - name: Build all crates (BLST backend)
        run: make build
      - name: Run tests (BLST backend)
        run: make test
      - name: Run Clippy (BLST backend)
        run: make clippy
      # BLST is the repository backend except where native BLST cannot target
      # the bare-metal/WASM configurations covered by the no_std checks.
      - name: Check no_std and WASM (Dusk backend)
        run: make no-std
      - name: Build benchmarks (BLST backend)
        run: make build-benches
      - name: Build documentation (BLST backend)
        run: make doc
      - name: Run examples (BLST backend)
        run: make examples

  solidity:
    name: Solidity verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Check Solidity formatting
        run: make solidity-fmt CHECK=1
      - name: Run EIP-2537 verifier tests
        run: make solidity-test
