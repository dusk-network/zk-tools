name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: make fmt CHECK=1

  build:
    name: Build all crates (BLST backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # The workspace includes plonkwasm. Backend selection is explicit, and
      # the Merkle crates expose mutually exclusive size_* features, so
      # --all-features is not a valid feature set.
      - run: make build

  test:
    name: Tests (BLST backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: make test

  clippy:
    name: Clippy (BLST backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: make clippy

  no-std:
    # BLST is the repository backend except where native BLST cannot target the
    # bare-metal/WASM configurations covered by the no_std checks.
    name: no_std and WASM (Dusk backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: make no-std

  benches:
    name: Build benchmarks (BLST backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: make build-benches

  documentation:
    name: Documentation (BLST backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: make doc

  examples:
    name: Examples (BLST backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: make examples
